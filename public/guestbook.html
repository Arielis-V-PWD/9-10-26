<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guestbook</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body class="page page-guestbook">
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">✦</span>
                <h1>Guestbook</h1>
            </div>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/guestbook">Guestbook</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                </ul>
            </nav>
        </header>

        <section class="guestbook-card">
            <div class="section-header">
                <div>
                    <p class="eyebrow">Community</p>
                    <h2>Leave a note</h2>
                </div>
            </div>

            <form id="guestbook-form">
                <label for="name">Name</label>
                <input id="name" type="text" name="name" maxlength="40" required />

                <label for="msg">Message</label>
                <textarea id="msg" name="msg" maxlength="280" required></textarea>

                <button type="submit">Post</button>
            </form>
            <p id="form-error" role="alert"></p>

            <div id="messages" aria-live="polite"></div>
        </section>
        <section class="guestbook-section">
            <p id="list-error" role="alert"></p>
            <ul id="guestbook-list"></ul>
        </section>
    </main>

    <script src="/js/guestbook.js"></script>
</body>

</html>

</html>
