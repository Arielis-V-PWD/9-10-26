<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body class="page page-dashboard">
    <main class="shell dashboard-layout">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">★</span>
                <h1>Dashboard</h1>
            </div>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/guestbook">Guestbook</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                </ul>
            </nav>
        </header>

        <section class="dashboard-card">
            <div class="dashboard-top">
                <div>
                    <p class="eyebrow">Overview</p>
                    <h2>Welcome back</h2>
                </div>
                <button type="button" id="logout-button" class="secondary-button">Logout</button>
            </div>

            <div class="dashboard-grid">
                <article class="stat-card">
                    <h3>Guestbook posts</h3>
                    <p class="stat-number">24</p>
                    <span>Fresh notes this week</span>
                </article>

                <article class="stat-card">
                    <h3>Highlights</h3>
                    <p class="stat-number">8</p>
                    <span>messages waiting for a reply</span>
                </article>

                <article class="stat-card">
                    <h3>Activity</h3>
                    <p class="stat-number">4</p>
                    <span>new visits today</span>
                </article>
            </div>
        </section>
    </main>

    <script src="/js/dashboard.js"></script>
</body>

</html>
